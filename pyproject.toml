[project]
name = "drama-series-agent"
version = "0.1.0"
description = "Series-scoped agent for short-drama production: intake, enrich, build, render jobs, chat shell — clone and render with local ComfyUI."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Drama Series Agent Contributors" }]
keywords = ["short-drama", "agent", "series", "comfyui", "aigc", "minimax", "h3"]
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "python-multipart>=0.0.9",
  "pydantic>=2.0",
  "loguru>=0.7",
  "httpx>=0.27",
  "openai>=1.40",
  "imageio-ffmpeg>=0.5",
]

[project.optional-dependencies]
render = ["comfykit>=0.1.12"]
dev = ["pytest>=7.0", "comfykit>=0.1.12"]

[project.scripts]
drama-series-api = "drama_series_agent.cli:run_api_main"
drama-series-render = "drama_series_agent.cli:run_episode_main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
