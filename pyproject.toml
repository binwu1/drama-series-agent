[project]
name = "drama-series-agent"
version = "0.1.0"
description = "Series-scoped agent for short-drama production: intake, enrich, build, render jobs, chat shell."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Drama Series Agent Contributors" }]
keywords = ["short-drama", "agent", "series", "comfyui", "aigc"]
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "pydantic>=2.0",
  "loguru>=0.7",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
